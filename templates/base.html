<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}SyncData{% endblock %}</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="/static/css/syncdata.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <button type="button" class="nav-toggle" onclick="toggleSidebar()" title="Recolher menu" aria-label="Recolher menu">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>

      <div class="sb-brand">
        <img src="/static/logo-256.png" alt="">
        <span class="txt">Sync<em>Data</em></span>
      </div>
      <div class="sb-tag">Conciliação de Notas</div>

      <div class="sb-section">Menu</div>

      <a href="/" class="sb-item {% if ativo == 'conciliar' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Conciliar
      </a>
      <a href="/impostos" class="sb-item {% if ativo == 'impostos' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Impostos
      </a>
      <a href="/historico" class="sb-item {% if ativo == 'historico' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Histórico
      </a>
      <a href="/configuracoes" class="sb-item {% if ativo == 'config' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Configurações
      </a>

      {% if cliente_nome %}
      <div class="sb-cliente">
        <div class="rot">Cliente</div>
        <div class="nome" title="{{ cliente_nome }}">{{ cliente_nome }}</div>
        <div class="cnpj">{{ cliente_cnpj }}</div>
      </div>
      {% endif %}
    </aside>

    <main class="main">
      <div class="wrap">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  <script>
    (function () {
      const app = document.querySelector('.app');
      if (!app) return;
      const mobile = window.matchMedia('(max-width: 760px)').matches;
      const key = mobile ? 'syncdata.sidebar.mobile' : 'syncdata.sidebar';
      const saved = localStorage.getItem(key);
      if (saved === 'collapsed' || (mobile && saved !== 'expanded')) app.classList.add('nav-collapsed');
    })();
    function toggleSidebar() {
      const app = document.querySelector('.app');
      if (!app) return;
      app.classList.toggle('nav-collapsed');
      const mobile = window.matchMedia('(max-width: 760px)').matches;
      const key = mobile ? 'syncdata.sidebar.mobile' : 'syncdata.sidebar';
      localStorage.setItem(key, app.classList.contains('nav-collapsed') ? 'collapsed' : 'expanded');
    }
  </script>
</body>
</html>
